<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track time spent on projects with focus sessions, reports, and archives.">
    <title>Time Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⏱️ Time Tracker</h1>
        </header>

        <main class="main-layout">
            <!-- Timer section now comes first (left column on desktop, top on mobile) -->
            <section class="timer-section" aria-labelledby="timer-heading">
                <h2 id="timer-heading" class="sr-only">Timer</h2>
                <div class="timer-display">
                    <div class="timer-time" id="timerDisplay" aria-live="polite" aria-atomic="true">00:00:00</div>
                </div>
                <div class="timer-controls">
                    <button id="focusBtn" class="btn btn-focus" disabled aria-pressed="false">Start Focus</button>
                    <button id="stopBtn" class="btn btn-stop" disabled>Stop</button>
                </div>
                <div class="timer-stats" id="timerStats" aria-label="Project statistics">
                    <div class="timer-stat-row">
                        <span class="stat-label">Started</span>
                        <span class="stat-value" id="projectStartDate">N/A</span>
                    </div>
                    <div class="timer-stat-row">
                        <span class="stat-label">Today</span>
                        <span class="stat-value" id="projectToday">0h 0m</span>
                    </div>
                    <div class="timer-stat-row">
                        <span class="stat-label">All time avg</span>
                        <span class="stat-value" id="projectAvg">0h 0m</span>
                    </div>
                    <div class="timer-stat-row">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="projectTotal">00:00:00</span>
                    </div>
                </div>
            </section>

            <!-- Projects section now second (right column on desktop, bottom on mobile) -->
            <section class="projects-section" aria-labelledby="projects-heading">
                <div class="projects-header">
                    <h2 id="projects-heading">Projects</h2>
                    <div class="global-actions" role="group" aria-label="Project actions">
                        <button id="detailsBtn" class="btn-action btn-details" disabled title="View detailed focus entries" aria-label="Details">
                            <span class="btn-icon" aria-hidden="true">📋</span>
                            <span class="btn-text">Details</span>
                        </button>
                        <button id="reportsBtn" class="btn-action btn-reports" disabled title="View analytics and charts" aria-label="Reports">
                            <span class="btn-icon" aria-hidden="true">📊</span>
                            <span class="btn-text">Reports</span>
                        </button>
                        <button id="deleteBtn" class="btn-action btn-delete" disabled title="Delete selected project" aria-label="Delete">
                            <span class="btn-icon" aria-hidden="true">🗑️</span>
                            <span class="btn-text">Delete</span>
                        </button>
                    </div>
                </div>
                <div class="add-project">
                    <label for="projectName" class="sr-only">New project name</label>
                    <input type="text" id="projectName" placeholder="Enter project name..." maxlength="50" autocomplete="off">
                    <button id="addProjectBtn" class="btn btn-primary">Add Project</button>
                </div>
                <div id="projectsList" class="projects-list" role="list"></div>
            </section>
        </main>
    </div>

    <div id="reportsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalProjectName" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalProjectName">Project Reports</h2>
                <button type="button" class="modal-close" id="closeModal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="time-period-tabs" role="tablist">
                    <button type="button" class="tab-btn active" data-period="daily" role="tab" aria-selected="true">Daily</button>
                    <button type="button" class="tab-btn" data-period="weekly" role="tab" aria-selected="false">Weekly</button>
                    <button type="button" class="tab-btn" data-period="monthly" role="tab" aria-selected="false">Monthly</button>
                </div>
                <div class="charts-container">
                    <div class="chart-section">
                        <h3>Time Spent</h3>
                        <canvas id="barChart" aria-label="Time spent chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailsModalTitle" aria-hidden="true">
        <div class="modal-content details-modal-content">
            <div class="modal-header">
                <h2 id="detailsModalTitle">Detailed Focus Entries</h2>
                <button type="button" class="modal-close" id="closeDetails" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body details-modal-body">
                <div class="details-table-wrapper" id="detailsWrapper">
                    <table class="details-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Project</th>
                                <th>Duration</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="detailsTableBody"></tbody>
                    </table>
                    <p class="empty-log" id="detailsEmptyState">No entries available</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
